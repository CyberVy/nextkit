[[permission]]
identifier = "ipc"
description = "Allows the trusted CMS web app to use native IPC commands."
commands.allow = [
  "fetch",
  "window_hub_register",
  "window_hub_unregister",
  "window_hub_send",
  "create_child_webview",
  "destroy_child_webview",
  "set_window_layout",
  "post_message_to_main",
  "post_message_to_webview",
]
